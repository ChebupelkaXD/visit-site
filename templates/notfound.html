<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Страница не найдена | Павел Сливенко</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        .error-container {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 4rem 1rem;
        }

        .error-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(8rem, 20vw, 14rem);
            font-weight: 800;
            line-height: 0.9;
            margin: 0;
            background: linear-gradient(135deg, var(--accent-green), #00ff88aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            animation: glitch 2s infinite alternate;
        }

        .error-title {
            font-size: clamp(2.5rem, 6vw, 4rem);
            margin: 1rem 0 1.5rem;
            color: var(--text-primary);
        }

        .error-message {
            font-size: 1.3rem;
            line-height: 1.7;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 2.5rem;
        }

        .error-message code {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-secondary);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            color: var(--accent-green);
        }

        .back-btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            font-weight: 600;
            color: #000;
            background: var(--accent-green);
            border: none;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.3);
        }

        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 255, 136, 0.45);
        }

        .back-btn:active {
            transform: translateY(0);
        }

        .error-illustration {
            max-width: 380px;
            width: 100%;
            margin: 2rem auto 3rem;
            opacity: 0.9;
        }

        .glitch {
            position: relative;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }

        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 var(--accent-green);
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -2px;
            text-shadow: 2px 0 #ff1361;
            animation: glitch-anim2 2.5s infinite linear alternate-reverse;
        }

        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
        }

        @keyframes glitch-anim {
            0% { clip: rect(0, 9999px, 0, 0); }
            5% { clip: rect(20px, 9999px, 80px, 0); }
            10% { clip: rect(40px, 9999px, 120px, 0); }
            /* ... и т.д. — можно добавить больше кадров */
        }

        @keyframes glitch-anim2 {
            0% { clip: rect(0, 9999px, 0, 0); }
            5% { clip: rect(60px, 9999px, 140px, 0); }
            10% { clip: rect(10px, 9999px, 100px, 0); }
        }

        @media (max-width: 768px) {
            .error-code {
                font-size: clamp(6rem, 18vw, 10rem);
            }
            .error-title {
                font-size: clamp(2rem, 5vw, 3rem);
            }
        }
    </style>
</head>
<body>
<div class="bg-grid"></div>

<!-- Частицы для атмосферы -->
<div class="particle" style="left: 10%; animation-delay: 0s;"></div>
<div class="particle" style="left: 30%; animation-delay: 3s;"></div>
<div class="particle" style="left: 50%; animation-delay: 6s;"></div>
<div class="particle" style="left: 70%; animation-delay: 9s;"></div>
<div class="particle" style="left: 90%; animation-delay: 12s;"></div>

<header>
    <nav class="container">
        <a href="/" class="logo">&lt;/QA&gt;</a>
        <button class="menu-toggle">☰</button>
        <ul class="nav-links">
            <li><a href="/">Главная</a></li>
            <li><a href="/about">О себе</a></li>
            <li><a href="/skills">Навыки</a></li>
<!--            <li><a href="/projects">Проекты</a></li>-->
            <li><a href="/experience">Опыт</a></li>
            <li><a href="/contacts">Контакты</a></li>
        </ul>
    </nav>
</header>

<main>
    <div class="error-container container">
        <h1 class="error-code glitch" data-text="404">404</h1>
        <h2 class="error-title">Страница не найдена</h2>

        <p class="error-message">
            Кажется, вы попытались перейти по адресу, которого <code>не существует</code>.<br>
            Возможно, ссылка устарела, или кто-то оставил баг в навигации 😅
        </p>

        <a href="/" class="back-btn">Вернуться на главную</a>
    </div>
</main>

<footer>
    <div class="container">
        <p>&copy; 2026 Павел Сливенко. QA Automation Engineer</p>
    </div>
</footer>

<script src="/static/js/main.js"></script>
</body>
</html>
