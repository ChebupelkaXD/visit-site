image: golang:1.25

stages:
  - test
  - build
  - deploy

unit-tests:
  stage: test
  image: golang:1.25
  script:
    - go test ./tests -v -tags=unit
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: never
    - when: on_success

integration-tests:
  stage: test
  image: golang:1.25
  script:
    - go test ./tests -v -tags=integration
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: never
    - when: on_success

build:
  stage: build
  image: docker:28
  services:
    - docker:28-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "master"'
      when: on_success

deploy_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client bash
    - eval $(ssh-agent -s)
    - cat "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $PROD_SERVER_IP >> ~/.ssh/known_hosts
  script:
    - |
      ssh -o StrictHostKeyChecking=no $PROD_USER@$PROD_SERVER_IP '
        set -e

        cd /opt/portfolio

        echo "=== Логинимся в Docker Hub ==="
        echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

        echo "=== Логинимся в GitLab Registry ==="
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

        echo "=== Переменные окружения ==="
        echo "REGISTRY_IMAGE = $CI_REGISTRY_IMAGE"
        echo "TAG            = $CI_COMMIT_REF_SLUG"

        echo "=== Pull и запуск приложения ==="
        REGISTRY_IMAGE="$CI_REGISTRY_IMAGE" \
        TAG="$CI_COMMIT_REF_SLUG" \
        docker compose pull app

        REGISTRY_IMAGE="$CI_REGISTRY_IMAGE" \
        TAG="$CI_COMMIT_REF_SLUG" \
        docker compose up -d --force-recreate app

        echo "=== Деплой завершён ==="
        docker compose ps
      '
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: on_success
  environment:
    name: production