image: golang:1.25

stages:
  - test
  - build
  - deploy

unit-tests:
  stage: test
  image: golang:1.25
  script:
    - go test ./tests -v -tags=unit
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: never
    - when: on_success

integration-tests:
  stage: test
  image: golang:1.25
  script:
    - go test ./tests -v -tags=integration
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: never
    - when: on_success

build:
  stage: build
  image: docker:28
  services:
    - docker:28-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "master"'
      when: on_success

deploy_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client bash
    - eval $(ssh-agent -s)
    - cat "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $PROD_SERVER_IP >> ~/.ssh/known_hosts
  script:
    # Создаём папку и копируем файлы (на случай изменений в compose или init.sql)
    - ssh $PROD_USER@$PROD_SERVER_IP "mkdir -p /opt/portfolio"
    - scp docker-compose.yml $PROD_USER@$PROD_SERVER_IP:/opt/portfolio/docker-compose.yml
    - scp init.sql $PROD_USER@$PROD_SERVER_IP:/opt/portfolio/init.sql

    # Деплой
    - |
      ssh $PROD_USER@$PROD_SERVER_IP "
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        cd /opt/portfolio &&
        # Удаляем старый контейнер (был без compose)
        docker stop portfolio 2>/dev/null || true &&
        docker rm portfolio 2>/dev/null || true &&
        # Запускаем compose с новой версией образа
        REGISTRY_IMAGE=$CI_REGISTRY_IMAGE TAG=$CI_COMMIT_REF_SLUG docker compose pull app &&
        REGISTRY_IMAGE=$CI_REGISTRY_IMAGE TAG=$CI_COMMIT_REF_SLUG docker compose up -d --force-recreate
      "
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: on_success
  environment:
    name: production